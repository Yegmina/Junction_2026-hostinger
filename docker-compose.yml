services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    volumes:
      - oracle_data:/data  # saved reports (/r/<id>) and the 24 h Cala cache
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  oracle_data:
