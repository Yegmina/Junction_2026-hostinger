# After each CI run, fetch CRACI's SBOM (CycloneDX) and network trace for every job through the
# CRACI API, attach them to the run and summarise them. Fails if a job reached a host outside the
# expected package registries. Needs the CRACI_API_TOKEN repository secret.
name: Supply chain

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  report:
    name: SBOMs and network traces
    runs-on: craci
    timeout-minutes: 10
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "1"
          network: |
            default: deny
            presets: [github]
            connections:
              - tls:
                  serverNamePatterns: [api.craci.com]
                  ports: [443]
      - uses: actions/checkout@v4
      - name: Collect SBOMs and traces from the CRACI API
        env:
          CRACI_API_TOKEN: ${{ secrets.CRACI_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 ci/craci_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain
          path: supply-chain/
          if-no-files-found: ignore
